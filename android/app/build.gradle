plugins {
    id 'com.android.application'
}

// The phone app has the same version as the desktop app (from package.json).
def pkg = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def (major, minor, patch) = pkg.version.tokenize('.-').take(3).collect { it.toInteger() }

// Release signing: keystore.properties next to this folder (never committed), or MERGIO_KEYSTORE* env vars in CI.
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def sign = { String key, String env -> signing.getProperty(key) ?: System.getenv(env) }
def storePath = sign('storeFile', 'MERGIO_KEYSTORE')

android {
    namespace 'io.github.ruchiraedirisinghe.mergio'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'io.github.ruchiraedirisinghe.mergio'
        minSdk 24
        // 34: the app draws inside the system bars, like it always has on older Androids
        targetSdk 34
        versionCode major * 10000 + minor * 100 + patch
        versionName pkg.version
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_shared' }
        }
    }

    signingConfigs {
        release {
            if (storePath) {
                storeFile file(storePath)
                storePassword sign('storePassword', 'MERGIO_KEYSTORE_PASSWORD')
                keyAlias sign('keyAlias', 'MERGIO_KEY_ALIAS')
                keyPassword sign('keyPassword', 'MERGIO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig storePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    // one APK per processor type: most phones are arm64, older ones armv7, the emulator x86_64
    splits {
        abi {
            enable true
            reset()
            include(*(project.findProperty('abis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(','))
            universalApk false
        }
    }

    sourceSets {
        main {
            // Node.js for Android (nodejs-mobile), downloaded by scripts/android.mjs
            jniLibs.srcDirs = ['libnode/bin']
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        // compress the Node.js library inside the APK (a much smaller download)
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
