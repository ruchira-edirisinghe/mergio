<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mergio</title>
  <link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/shared/app-192.png">
  <meta name="theme-color" content="#0b0b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-mark">
      <div class="boot-halo"></div>
      <svg viewBox="0 0 528 528" width="96" height="96">
        <defs>
          <linearGradient id="bt-left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b3dff"/><stop offset=".55" stop-color="#5a32f0"/><stop offset="1" stop-color="#e03cf2"/></linearGradient>
          <linearGradient id="bt-right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e23cf6"/><stop offset=".5" stop-color="#ff2aa8"/><stop offset="1" stop-color="#ff1f5a"/></linearGradient>
          <linearGradient id="bt-fold-l" gradientUnits="userSpaceOnUse" x1="150" y1="60" x2="262" y2="250"><stop offset="0" stop-color="#6a36ff"/><stop offset=".5" stop-color="#2c1580"/><stop offset="1" stop-color="#0f0828"/></linearGradient>
          <linearGradient id="bt-fold-r" gradientUnits="userSpaceOnUse" x1="374" y1="60" x2="262" y2="250"><stop offset="0" stop-color="#d63cff"/><stop offset=".55" stop-color="#9a3cff"/><stop offset="1" stop-color="#5b1fb0"/></linearGradient>
          <linearGradient id="bt-play" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfc8ef"/></linearGradient>
          <mask id="bt-feet" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="440"><rect width="520" height="440" fill="#fff"/><path d="M18 436L176 318L260 318L260 440L0 440Z" fill="#000"/><path d="M392 436L540 326L540 440L300 440Z" fill="#000"/></mask>
        </defs>
        <g transform="translate(4 44)">
          <g mask="url(#bt-feet)" fill="none" stroke-width="108" stroke-linejoin="round">
            <path class="s1" pathLength="1" d="M66 470L150 82L188.1 129.6" stroke="url(#bt-left)"/>
            <path class="s2" pathLength="1" d="M150 82L262 222" stroke="url(#bt-fold-l)"/>
            <path class="s3" pathLength="1" d="M262 222L374 82" stroke="url(#bt-fold-r)"/>
            <path class="s4" pathLength="1" d="M335.9 129.6L374 82L458 470" stroke="url(#bt-right)"/>
          </g>
          <path class="play" d="M228 216L228 302L298 259Z" fill="url(#bt-play)" stroke="url(#bt-play)" stroke-width="22" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div class="boot-name">Mergio</div>
    <div class="boot-bar"><i></i></div>
  </div>
  <div class="offline-bar" role="alert">Mergio isn't running. Start it from the Mergio icon; this page reconnects by itself.</div>
  <div class="app">
    <aside class="side">
      <div class="side-top">
        <div class="brand">
          <img class="wm" src="/shared/wordmark.svg" alt="Mergio" width="170" height="44">
          <img class="mk" src="/shared/logo.svg" alt="Mergio" width="34" height="34">
          <small id="version">v—</small>
        </div>
        <button class="icon-btn side-btn" id="btnSide" aria-expanded="true" title="Shrink the sidebar" aria-label="Shrink the sidebar"></button>
      </div>
      <nav id="nav" aria-label="Pages"></nav>
      <div class="side-foot">
        <div class="live-sum" id="liveSum"><span class="dot"></span><span>Starting…</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="pageTitle">Home</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="btnInstall" title="Open Mergio in its own window instead of a browser tab" hidden></button>
          <button class="btn ghost" id="btnGuide" title="Step-by-step guide"></button>
          <button class="btn ghost" id="btnTest" title="Send sample messages and alerts to the overlay"></button>
          <button class="btn ghost" id="btnPreview" title="Show the live preview" hidden></button>
          <button class="btn primary" id="btnCopy" title="Copy the link you paste into OBS"></button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>

    <aside class="preview" id="previewPane" aria-label="Live preview">
      <div class="preview-head">
        <b>Live preview</b>
        <div class="seg" id="bgSeg" role="group" aria-label="Preview background">
          <button data-bg="game" class="on">Game</button><button data-bg="dark">Dark</button><button data-bg="light">Light</button>
        </div>
        <button class="icon-btn x" id="btnPreviewClose" title="Hide preview" aria-label="Hide preview"></button>
      </div>
      <div class="stage bg-game" id="stage">
        <iframe id="previewFrame" src="/overlay?preview=1" title="Overlay preview"></iframe>
        <iframe id="alertsFrame" src="/alerts?preview=1" title="Alerts overlay preview" tabindex="-1"></iframe>
        <iframe id="counterFrame" title="Counter overlay preview" tabindex="-1"></iframe>
      </div>
      <div class="preview-foot counter-foot"><span class="lbl">Sample numbers show here while you're offline. In OBS your real numbers show.</span></div>
      <div class="preview-foot chat-foot">
        <span class="lbl">Try:</span>
        <button class="btn ghost sm" data-test="random">Message</button>
        <button class="btn ghost sm" data-test="gift">Gift</button>
        <button class="btn ghost sm" data-test="follow">Follow</button>
        <button class="btn ghost sm" data-test="sub">Sub</button>
        <button class="btn ghost sm" data-test="superchat">Super Chat</button>
      </div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/shared/icons.js"></script>
  <script src="/shared/glyphs.js"></script>
  <script src="/dashboard/core.js"></script>
  <script src="/dashboard/install.js"></script>
  <script src="/dashboard/counters.js"></script>
  <script src="/dashboard/pages/home.js"></script>
  <script src="/dashboard/pages/chats.js"></script>
  <script src="/dashboard/pages/obs.js"></script>
  <script src="/dashboard/pages/style.js"></script>
  <script src="/dashboard/pages/alerts.js"></script>
  <script src="/dashboard/pages/viewers.js"></script>
  <script src="/dashboard/pages/live.js"></script>
  <script src="/dashboard/pages/settings.js"></script>
  <script src="/dashboard/pages/help.js"></script>
  <script src="/dashboard/guide.js"></script>
  <script src="/dashboard/fbguide.js"></script>
  <script src="/dashboard/update.js"></script>
</body>
</html>
