<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mergio</title>
  <link rel="icon" href="/shared/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/shared/app-192.png">
  <meta name="theme-color" content="#0b0b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body>
  <div class="offline-bar" role="alert">Mergio isn't running. Start it from the Mergio icon; this page reconnects by itself.</div>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="/shared/wordmark.svg" alt="Mergio" width="170" height="44">
        <small id="version">v—</small>
      </div>
      <nav id="nav" aria-label="Pages"></nav>
      <div class="side-foot">
        <div class="live-sum" id="liveSum"><span class="dot"></span><span>Starting…</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1 id="pageTitle">Home</h1>
          <p id="pageSub"></p>
        </div>
        <div class="top-actions">
          <button class="btn ghost" id="btnInstall" title="Open Mergio in its own window instead of a browser tab" hidden></button>
          <button class="btn ghost" id="btnGuide" title="Step-by-step guide"></button>
          <button class="btn ghost" id="btnTest" title="Send sample messages and alerts to the overlay"></button>
          <button class="btn ghost" id="btnPreview" title="Show the live preview" hidden></button>
          <button class="btn primary" id="btnCopy" title="Copy the link you paste into OBS"></button>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>

    <aside class="preview" id="previewPane" aria-label="Live preview">
      <div class="preview-head">
        <b>Live preview</b>
        <div class="seg" id="bgSeg" role="group" aria-label="Preview background">
          <button data-bg="game" class="on">Game</button><button data-bg="dark">Dark</button><button data-bg="light">Light</button>
        </div>
        <button class="icon-btn x" id="btnPreviewClose" title="Hide preview" aria-label="Hide preview"></button>
      </div>
      <div class="stage bg-game" id="stage">
        <iframe id="previewFrame" src="/overlay?preview=1" title="Overlay preview"></iframe>
        <iframe id="alertsFrame" src="/alerts?preview=1" title="Alerts overlay preview" tabindex="-1"></iframe>
      </div>
      <div class="preview-foot">
        <span class="lbl">Try:</span>
        <button class="btn ghost sm" data-test="random">Message</button>
        <button class="btn ghost sm" data-test="gift">Gift</button>
        <button class="btn ghost sm" data-test="follow">Follow</button>
        <button class="btn ghost sm" data-test="sub">Sub</button>
        <button class="btn ghost sm" data-test="superchat">Super Chat</button>
      </div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/shared/icons.js"></script>
  <script src="/shared/glyphs.js"></script>
  <script src="/dashboard/core.js"></script>
  <script src="/dashboard/install.js"></script>
  <script src="/dashboard/pages/home.js"></script>
  <script src="/dashboard/pages/chats.js"></script>
  <script src="/dashboard/pages/obs.js"></script>
  <script src="/dashboard/pages/style.js"></script>
  <script src="/dashboard/pages/alerts.js"></script>
  <script src="/dashboard/pages/live.js"></script>
  <script src="/dashboard/pages/settings.js"></script>
  <script src="/dashboard/pages/help.js"></script>
  <script src="/dashboard/guide.js"></script>
  <script src="/dashboard/update.js"></script>
</body>
</html>
