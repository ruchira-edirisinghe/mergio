<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b10">
  <title>Mergio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0%, #241a44, #0b0b10 60%); color: #ececf4; font: 15px/1.5 'Segoe UI', system-ui, sans-serif; text-align: center; }
    main { max-width: 420px; display: grid; justify-items: center; gap: 14px; }
    img { width: 88px; height: 88px; }
    h1 { margin: 6px 0 0; font-size: 22px; }
    p { margin: 0; color: #a8a8bd; }
    .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 11px 20px; border-radius: 12px; border: 0; font: 600 15px 'Segoe UI', system-ui, sans-serif; color: #fff; text-decoration: none; background: linear-gradient(135deg, #7b3dff, #ff2aa8); cursor: pointer; }
    .wait { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #8d8da3; }
    .wait i { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: blink 1.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  </style>
</head>
<body>
  <main>
    <img src="/shared/app-192.png" alt="">
    <h1>Mergio isn't running</h1>
    <p id="how">Start Mergio and this window opens the control panel by itself.</p>
    <a class="btn" id="start" href="mergio://start">Start Mergio</a>
    <span class="wait"><i></i>Waiting for Mergio…</span>
  </main>
  <script>
    // macOS opens the app from Applications; Windows and Linux installs register the mergio:// link.
    if (/Mac/.test(navigator.platform)) {
      document.getElementById('how').textContent = 'Open Mergio from your Applications folder. This window opens the control panel by itself.';
      document.getElementById('start').remove();
    }
    setInterval(() => fetch('/api/state', { cache: 'no-store' }).then(r => { if (r.ok) location.replace('/dashboard'); }).catch(() => {}), 2000);
  </script>
</body>
</html>
