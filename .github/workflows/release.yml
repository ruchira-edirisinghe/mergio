name: Release

# Push a tag like v1.0.1 to build OmniChat for Windows, macOS and Linux and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OmniChat-windows-x64.zip
          - os: macos-latest
            asset: OmniChat-macos-arm64.tar.gz
          - os: ubuntu-latest
            asset: OmniChat-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/OmniChat.exe, dist/README.md, dist/LICENSE -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.asset }} -C dist omnichat README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
